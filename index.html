<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>図書貸出ステーション</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
:root{
  --bg:#f4f6f0;
  --surface:#ffffff;
  --surface-alt:#eaefe3;
  --ink:#1a231d;
  --ink-soft:#546052;
  --border:#d9ddcd;
  --accent:#3f6b4a;
  --accent-ink:#2a4a33;
  --accent-soft:#dfe9df;
  --warn:#a2601f;
  --warn-soft:#f3e5d1;
  --bad:#a23f3f;
  --bad-soft:#f5e2e2;
  --shadow: 0 1px 2px rgba(20,30,20,.06), 0 8px 24px rgba(20,30,20,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10150f; --surface:#1a2117; --surface-alt:#212a1c;
    --ink:#e8ece2; --ink-soft:#a7b19f; --border:#333f2c;
    --accent:#83b892; --accent-ink:#bfe0c8; --accent-soft:#233227;
    --warn:#e0a25f; --warn-soft:#3a2c19; --bad:#e08080; --bad-soft:#3a2222;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#10150f; --surface:#1a2117; --surface-alt:#212a1c;
  --ink:#e8ece2; --ink-soft:#a7b19f; --border:#333f2c;
  --accent:#83b892; --accent-ink:#bfe0c8; --accent-soft:#233227;
  --warn:#e0a25f; --warn-soft:#3a2c19; --bad:#e08080; --bad-soft:#3a2222;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New",sans-serif;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.mono{ font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; }

header{
  flex:none;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; row-gap:8px;
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
header h1{
  font-family:"Shippori Mincho",serif; font-size:18px; margin:0;
  white-space:nowrap;
}
.tabs{ display:flex; gap:6px; margin-left:auto; }
.tab{
  border:none; background:transparent; color:var(--ink-soft);
  font-family:"Zen Kaku Gothic New",sans-serif; font-size:14px; font-weight:500;
  padding:9px 16px; border-radius:20px; cursor:pointer;
}
@media (max-width:480px){
  header h1{ flex:1 1 100%; font-size:16px; }
  .tabs{ margin-left:0; width:100%; justify-content:space-between; }
  .tab{ flex:1; padding:9px 8px; font-size:13px; text-align:center; }
}
.tab[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent-ink); }
.badge-count{
  font-family:"JetBrains Mono",monospace; font-size:10.5px;
  background:var(--warn-soft); color:var(--warn);
  border-radius:10px; padding:1px 7px; margin-left:5px;
}

main{ flex:1; min-height:0; overflow-y:auto; padding:20px 18px 40px; }
.panel{ max-width:760px; margin:0 auto; }
.panel[hidden]{ display:none; }

.section-title{ font-size:13px; color:var(--ink-soft); letter-spacing:.03em; margin:0 0 10px; }

/* -------- lending -------- */
.picker{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:16px; box-shadow:var(--shadow); margin-bottom:20px;
}
.picker-row{ display:flex; gap:10px; }
.search{
  flex:1; border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; font-size:15px; font-family:inherit; background:var(--bg); color:var(--ink);
}
.scan-btn{
  flex:none; display:flex; align-items:center; gap:8px;
  background:var(--accent); color:#fff; border:none; border-radius:10px;
  padding:12px 18px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit;
}
.scan-btn.secondary{ background:var(--surface-alt); color:var(--accent-ink); }
.scan-btn:active{ opacity:.85; }
.scan-btn:disabled{ background:var(--surface-alt); color:var(--ink-soft); cursor:not-allowed; }
.student-list{ display:grid; gap:6px; margin-top:12px; max-height:220px; overflow-y:auto; }
.student-row{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:9px; cursor:pointer; border:1px solid transparent;
}
.student-row:hover{ background:var(--surface-alt); }
.grade-pill{
  font-family:"JetBrains Mono",monospace; font-size:11px; background:var(--accent-soft);
  color:var(--accent-ink); padding:2px 8px; border-radius:10px; flex:none;
}
.student-row .name{ font-weight:500; }
.student-row .id{ margin-left:auto; font-size:11.5px; color:var(--ink-soft); }

.current-student{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:18px 20px; box-shadow:var(--shadow); margin-bottom:16px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.current-student .avatar{
  width:44px; height:44px; border-radius:50%; background:var(--accent-soft);
  color:var(--accent-ink); display:flex; align-items:center; justify-content:center;
  font-family:"Shippori Mincho",serif; font-weight:700; font-size:18px; flex:none;
}
.current-student .info{ flex:1; min-width:120px; }
.current-student .info .name{ font-family:"Shippori Mincho",serif; font-weight:700; font-size:17px; }
.current-student .info .meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
.ghost-btn{
  background:transparent; border:1px solid var(--border); color:var(--ink-soft);
  border-radius:9px; padding:9px 14px; font-size:13px; cursor:pointer; font-family:inherit;
}

.cart{ display:grid; gap:8px; margin-bottom:18px; }
.cart-item{
  display:flex; align-items:center; gap:12px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
}
.cart-item .title{ font-weight:500; flex:1; }
.cart-item .isbn{ font-size:11px; color:var(--ink-soft); }
.cart-item .remove{ background:none; border:none; color:var(--bad); font-size:13px; cursor:pointer; }
.cart-empty{
  border:1.5px dashed var(--border); border-radius:10px; padding:22px;
  text-align:center; color:var(--ink-soft); font-size:13.5px; margin-bottom:18px;
}
.limit-note{ font-size:12.5px; color:var(--ink-soft); margin:6px 2px 18px; }
.limit-note.full{ color:var(--warn); }

.primary-btn{
  width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px;
  padding:16px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;
}
.primary-btn:disabled{ background:var(--surface-alt); color:var(--ink-soft); cursor:not-allowed; }

/* -------- return -------- */
.loan-row{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px 16px; margin-bottom:8px; box-shadow:var(--shadow);
}
.loan-row .who{ font-weight:600; font-size:14px; min-width:90px; }
.loan-row .book{ flex:1; min-width:140px; font-size:13.5px; }
.loan-row .book .isbn{ font-size:11px; color:var(--ink-soft); display:block; }
.loan-row .due{ font-size:12px; }
.pill{
  font-family:"JetBrains Mono",monospace; font-size:11px; padding:3px 9px; border-radius:20px;
}
.pill.ok{ background:var(--accent-soft); color:var(--accent-ink); }
.pill.overdue{ background:var(--bad-soft); color:var(--bad); }
.return-btn{
  background:var(--surface-alt); color:var(--accent-ink); border:none; border-radius:8px;
  padding:8px 14px; font-size:12.5px; cursor:pointer; font-family:inherit; font-weight:600;
}
.empty-state{
  text-align:center; color:var(--ink-soft); font-size:13.5px; padding:40px 0;
}

/* -------- status -------- */
.stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px; }
.stat-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px 16px; box-shadow:var(--shadow);
}
.stat-tile .num{ font-family:"JetBrains Mono",monospace; font-size:24px; font-weight:600; }
.stat-tile .label{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
table{ width:100%; border-collapse:collapse; font-size:13px; background:var(--surface);
  border:1px solid var(--border); border-radius:10px; overflow:hidden; }
th{ text-align:left; background:var(--surface-alt); color:var(--ink-soft); font-size:11px;
  font-weight:600; padding:9px 12px; }
td{ padding:9px 12px; border-top:1px solid var(--border); }
.milestone{ color:var(--warn); font-weight:700; }

/* -------- camera modal -------- */
.cam-overlay{
  position:fixed; inset:0; background:rgba(10,14,10,.85);
  display:flex; align-items:center; justify-content:center; z-index:50;
}
.cam-overlay[hidden]{ display:none; }
.cam-box{
  background:var(--surface); border-radius:16px; padding:18px;
  width:min(92vw,420px); text-align:center;
}
.cam-frame{ position:relative; }
.cam-box video{ width:100%; border-radius:10px; background:#000; aspect-ratio:1/1; object-fit:cover; display:block; }
.cam-box.wide video{ aspect-ratio:16/9; }
.cam-guide{
  position:absolute; inset:14%; border:2.5px dashed rgba(255,255,255,.85);
  border-radius:12px; pointer-events:none;
}
.cam-box.wide .cam-guide{ inset:22% 8%; border-radius:8px; }
.cam-hint{
  position:absolute; left:0; right:0; bottom:6px; text-align:center;
  color:#fff; font-size:11.5px; text-shadow:0 1px 3px rgba(0,0,0,.6); pointer-events:none;
}
.cam-box p{ font-size:13px; color:var(--ink-soft); margin:12px 0; }
.cam-box .cam-err{ color:var(--bad); font-size:12.5px; }
.cam-box .ghost-btn{ margin-top:6px; }

.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--accent); color:#fff; padding:12px 20px; border-radius:30px;
  font-size:13.5px; font-weight:600; box-shadow:var(--shadow); z-index:60;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
[hidden]{ display:none !important; }
#appShell{ display:flex; flex-direction:column; flex:1; min-height:0; }
#authPanel{ width:min(92%,440px); margin:40px auto; overflow-y:auto; }
#authPanel h1{ font-size:22px; }
#loginForm{ display:grid; gap:12px; }
#loginForm label{ display:grid; gap:5px; font-size:14px; }
#sessionControls{ display:flex; align-items:center; gap:10px; padding:8px 18px; background:var(--surface); font-size:13px; flex-wrap:wrap; }
#sessionStatus{ flex:1; }
#authMessage{ line-height:1.8; }
.search{ min-width:0; }
</style>
</head>
<body>

<section id="authPanel" class="picker" aria-labelledby="authTitle">
  <h1 id="authTitle">📚 図書貸出ステーション</h1>
  <p id="authMessage" role="status">接続設定を確認しています…</p>
  <form id="loginForm" hidden>
    <label>メールアドレス<input id="email" class="search" type="email" autocomplete="username" required></label>
    <label>パスワード<input id="password" class="search" type="password" autocomplete="current-password" required></label>
    <button id="loginButton" class="primary-btn" type="submit">ログイン</button>
  </form>
  <noscript>このアプリを使用するにはJavaScriptを有効にしてください。</noscript>
</section>
<div id="sessionControls" hidden>
  <span id="sessionStatus" role="status"></span>
  <button id="seedDemo" class="ghost-btn" hidden>ダミーデータを初期登録</button>
  <button id="logoutButton" class="ghost-btn">ログアウト</button>
</div>
<div id="appShell" hidden>
<header>
  <h1>📚 図書貸出ステーション</h1>
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="lend" aria-selected="true">貸出</button>
    <button class="tab" data-tab="return">返却<span class="badge-count" id="activeCount" hidden></span></button>
    <button class="tab" data-tab="status">状況</button>
  </div>
</header>

<main>
  <!-- 貸出 -->
  <section class="panel" id="panel-lend">
    <div id="lendPicker">
      <p class="section-title">生徒を選ぶ</p>
      <div class="picker">
        <div class="picker-row">
          <input class="search" id="studentSearch" placeholder="名前で検索…" autocomplete="off">
          <button class="scan-btn" data-scan="student">📷 QRでスキャン</button>
        </div>
        <div class="student-list" id="studentList"></div>
      </div>
    </div>

    <div id="lendActive" hidden>
      <div class="current-student" id="currentStudentCard"></div>

      <p class="section-title">借りる本</p>
      <div class="cart" id="cartList"></div>
      <div class="cart-empty" id="cartEmpty">まだ本がスキャンされていません</div>
      <div class="picker-row" style="margin-bottom:6px;">
        <button class="scan-btn" id="scanBookBtn" data-scan="book" style="flex:1;">📷 本のISBNバーコードをスキャンして追加</button>
      </div>
      <p class="limit-note" id="limitNote">1人3冊まで借りられます</p>
      <button class="primary-btn" id="confirmLend" disabled>この内容で貸出を確定する</button>
    </div>
  </section>

  <!-- 返却 -->
  <section class="panel" id="panel-return" hidden>
    <p class="section-title">本をスキャンして返却</p>
    <button class="scan-btn" data-scan="return" style="width:100%; justify-content:center; margin-bottom:18px;">📷 返却する本のISBNバーコードをスキャン</button>
    <p class="section-title">貸出中の一覧（手動で返却も可能）</p>
    <div id="loanList"></div>
  </section>

  <!-- 状況 -->
  <section class="panel" id="panel-status" hidden>
    <div class="stat-row">
      <div class="stat-tile"><div class="num mono" id="statActive">0</div><div class="label">貸出中</div></div>
      <div class="stat-tile"><div class="num mono" id="statOverdue">0</div><div class="label">延滞中</div></div>
      <div class="stat-tile"><div class="num mono" id="statTotal">0</div><div class="label">累計貸出冊数</div></div>
    </div>
    <p class="section-title">貸出中の詳細</p>
    <div style="overflow-x:auto; margin-bottom:24px;">
      <table id="activeTable"><thead><tr><th>生徒</th><th>本</th><th>貸出日</th><th>返却期限</th><th>状態</th></tr></thead><tbody></tbody></table>
    </div>
    <p class="section-title">生徒別 累計冊数</p>
    <div style="overflow-x:auto;">
      <table id="studentTable"><thead><tr><th>生徒</th><th>学年</th><th>累計</th><th>達成</th></tr></thead><tbody></tbody></table>
    </div>
  </section>
</main>
</div>

<div class="cam-overlay" id="camOverlay" hidden>
  <div class="cam-box">
    <p id="camLabel">カードのQRを枠内に写してください</p>
    <div class="cam-frame">
      <video id="camVideo" playsinline muted></video>
      <div class="cam-guide"></div>
      <div class="cam-hint">枠いっぱいに大きく写してください</div>
    </div>
    <canvas id="camCanvas" hidden></canvas>
    <p class="cam-err" id="camErr" hidden></p>
    <p id="camDebug" style="font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin:4px 0 0;"></p>
    <button class="ghost-btn" id="camCancel">キャンセル</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
