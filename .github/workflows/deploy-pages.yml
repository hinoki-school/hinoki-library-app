name: Publish configured library app
# Manual after the owner switches Pages Source from branch publishing to Actions.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: library-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare runtime configuration outside checkout
        id: artifact
        run: node tools/build-pages.mjs
        env:
          HINOKI_FIREBASE_CONFIG: ${{ secrets.HINOKI_FIREBASE_CONFIG }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.artifact.outputs.path }}
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
